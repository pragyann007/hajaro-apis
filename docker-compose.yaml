version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: hajaro_postgres
    environment:
      POSTGRES_DB: hajaro_dev
      POSTGRES_USER: hajaro
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hajaro_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hajaro.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: always

volumes:
  postgres_data: